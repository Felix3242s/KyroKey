version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: kyro-postgres
    environment:
      POSTGRES_USER: kyro
      POSTGRES_PASSWORD: kyro_password
      POSTGRES_DB: kyro_licenses
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - kyro-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kyro-backend
    environment:
      DATABASE_URL: postgresql://kyro:kyro_password@postgres:5432/kyro_licenses?schema=public
      JWT_SECRET: your-super-secret-jwt-key-change-this-in-production
      JWT_EXPIRES_IN: 7d
      SESSION_SECRET: your-session-secret-change-this
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
      PORT: 3001
      NODE_ENV: production
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 100
      HWID_RESET_LIMIT: 3
      HWID_RESET_COOLDOWN_DAYS: 7
    depends_on:
      - postgres
    ports:
      - "3001:3001"
    networks:
      - kyro-network

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    container_name: kyro-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks:
      - kyro-network

  nginx:
    image: nginx:alpine
    container_name: kyro-nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    networks:
      - kyro-network

volumes:
  postgres_data:

networks:
  kyro-network:
    driver: bridge
